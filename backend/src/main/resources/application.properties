server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USER:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
parking.upgrade.adopt-legacy=${PARKING_ADOPT_LEGACY_SCHEMA:false}
parking.upgrade.backup=${PARKING_UPGRADE_BACKUP:}
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
parking.rate-per-minute=${PARKING_RATE_PER_MINUTE:1.00}
parking.checkout.quote-validity-seconds=${PARKING_CHECKOUT_QUOTE_VALIDITY_SECONDS:120}
parking.initial-slots=${PARKING_INITIAL_SLOTS:20}
parking.admin-username=${PARKING_ADMIN_USER:}
parking.admin-password=${PARKING_ADMIN_PASSWORD:}
parking.maintenance=${PARKING_MAINTENANCE:false}
parking.backup.directory=${PARKING_BACKUP_DIRECTORY:./backups}
parking.backup.keep=${PARKING_BACKUP_KEEP:20}
parking.backup.cron=${PARKING_BACKUP_CRON:-}
parking.backup.pg-dump=${PARKING_PG_DUMP:pg_dump}
