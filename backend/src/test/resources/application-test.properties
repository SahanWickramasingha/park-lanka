# Isolated tests never read backend/.env or connect to the live database.
parking.env.enabled=false
DATABASE_URL=jdbc:h2:mem:defaulttest;DB_CLOSE_DELAY=-1
DATABASE_USER=sa
DATABASE_PASSWORD=
PARKING_ADMIN_USER=testadmin
